<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CourseAI – Smart Learning Recommendations{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f172a;
      --bg2: #1e293b;
      --bg3: #334155;
      --border: #334155;
      --primary: #6366f1;
      --primary-light: #818cf8;
      --accent: #8b5cf6;
      --accent2: #a78bfa;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --card: #1e293b;
      --radius: 14px;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    nav {
      background: rgba(15,23,42,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      padding: 0 2rem;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
    }
    .nav-brand {
      font-size: 1.3rem; font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 0.5rem; }
    .nav-links a {
      color: var(--text-muted); text-decoration: none;
      padding: 0.45rem 1rem; border-radius: 8px;
      font-size: 0.9rem; font-weight: 500;
      transition: all 0.2s;
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--text); background: var(--bg2);
    }
    .nav-links a.active { color: var(--primary-light); }

    .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.65rem 1.5rem; border-radius: 10px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      border: none; text-decoration: none; transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(99,102,241,0.4); }
    .btn-outline {
      background: transparent; color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { background: var(--bg2); }

    .badge {
      display: inline-block; padding: 0.25rem 0.65rem;
      border-radius: 999px; font-size: 0.75rem; font-weight: 600;
    }
    .badge-beginner { background: rgba(16,185,129,0.15); color: #34d399; }
    .badge-intermediate { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .badge-advanced { background: rgba(239,68,68,0.15); color: #f87171; }
    .badge-mixed { background: rgba(99,102,241,0.15); color: #818cf8; }

    .stars { color: #fbbf24; font-size: 0.85rem; }
    .rating-num { color: var(--text-muted); font-size: 0.8rem; }

    footer {
      border-top: 1px solid var(--border); padding: 2rem;
      text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 4rem;
    }

    .tag {
      display: inline-block; padding: 0.2rem 0.6rem;
      background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.2);
      border-radius: 6px; font-size: 0.75rem; color: var(--primary-light);
      cursor: pointer; transition: all 0.15s;
    }
    .tag:hover { background: rgba(99,102,241,0.2); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.4s ease forwards; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/" class="nav-brand">🎓 CourseAI</a>
    <div class="nav-links">
      <a href="/" {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>Home</a>
      <a href="/recommend/" {% if request.resolver_match.url_name == 'recommend' %}class="active"{% endif %}>Recommend</a>
      <a href="/explore/" {% if request.resolver_match.url_name == 'explore' %}class="active"{% endif %}>Explore</a>
      <a href="/analytics/" {% if request.resolver_match.url_name == 'analytics' %}class="active"{% endif %}>Analytics</a>
    </div>
  </div>
</nav>

{% block content %}{% endblock %}

<footer>
  <p>CourseAI &mdash; E-Learning Recommendation System &bull; Final Year Project &bull; Powered by TF-IDF + Cosine Similarity</p>
</footer>
</body>
</html>
