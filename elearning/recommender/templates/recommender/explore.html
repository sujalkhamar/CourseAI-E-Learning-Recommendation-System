{% extends 'recommender/base.html' %}
{% block title %}Explore Courses – CourseAI{% endblock %}

{% block extra_head %}
<style>
  .filter-bar {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.2rem 1.5rem;
    display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  .filter-group { display: flex; flex-direction: column; gap: 0.35rem; flex:1; min-width: 150px; }
  .filter-group label { font-size: 0.78rem; color: var(--text-muted); font-weight: 500; }
  .filter-group input, .filter-group select {
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text); padding: 0.6rem 0.9rem; border-radius: 9px; font-size: 0.9rem; outline: none;
  }
  .filter-group input:focus, .filter-group select:focus { border-color: var(--primary); }
  .courses-list { display: grid; gap: 1rem; }
  .course-row {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.2rem 1.4rem;
    display: grid; grid-template-columns: 1fr auto;
    gap: 1rem; align-items: center;
    transition: border-color 0.2s;
  }
  .course-row:hover { border-color: var(--primary); }
  .cr-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.25rem; }
  .cr-meta { display: flex; gap: 0.7rem; flex-wrap: wrap; align-items: center; margin-top: 0.5rem; }
  .cr-uni { font-size: 0.8rem; color: var(--text-muted); }
  .results-count { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem; }
</style>
{% endblock %}

{% block content %}
<div class="container" style="padding-top:2rem;">
  <h1 style="font-size:2rem;font-weight:800;margin-bottom:0.5rem;">🔍 Explore Courses</h1>
  <p style="color:var(--text-muted);margin-bottom:1.5rem;">Browse all {{ total }} Coursera courses in the dataset.</p>

  <form method="GET" action="/explore/" id="explore-form">
    <div class="filter-bar">
      <div class="filter-group" style="flex:2;">
        <label>Search by name, university, or skill</label>
        <input type="text" name="search" value="{{ search }}" placeholder="e.g. machine learning, Python, Stanford…">
      </div>
      <div class="filter-group">
        <label>Difficulty</label>
        <select name="difficulty">
          <option value="All" {% if selected_difficulty == 'All' %}selected{% endif %}>All Levels</option>
          {% for level in difficulty_levels %}
          <option value="{{ level }}" {% if selected_difficulty == level %}selected{% endif %}>{{ level }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="filter-group">
        <label>Sort by</label>
        <select name="sort">
          <option value="rating" {% if sort == 'rating' %}selected{% endif %}>Highest Rating</option>
          <option value="name" {% if sort == 'name' %}selected{% endif %}>Name A–Z</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" id="filter-btn" style="display:none;">Filter</button>
    </div>
  </form>

  <div id="course-list-container">
    {% include 'recommender/partials/course_list.html' %}
  </div>
</div>

<script>
  const form = document.getElementById('explore-form');
  let timeout = null;
  form.addEventListener('input', () => {
    clearTimeout(timeout);
    timeout = setTimeout(() => {
      const qs = new URLSearchParams(new FormData(form)).toString();
      fetch(`/explore/?${qs}`, {
        headers: {
          'X-Requested-With': 'XMLHttpRequest'
        }
      })
      .then(response => response.text())
      .then(html => {
        document.getElementById('course-list-container').innerHTML = html;
      });
    }, 300);
  });

  function toggleBookmark(name, url, btn) {
    fetch('/bookmark/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({course_name: name, course_url: url})
    }).then(r => r.json()).then(data => {
      if(data.status === 'added') { btn.innerHTML = '🌟'; btn.style.transform = 'scale(1.2)'; setTimeout(()=>btn.style.transform='scale(1)',200); }
      else { btn.innerHTML = '⭐'; }
    });
  }
</script>
{% endblock %}
